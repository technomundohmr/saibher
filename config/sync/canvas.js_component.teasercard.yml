js:
  original: |-
    const Component = ({
      image = null,
      category = '',
      title = '',
      excerpt = '',
      date = '',
      readTime = '',
      linkUrl = '#',
      linkText = '',
      linkTarget = '_self',
    }) => {
      return (
        <div className="teaserCard">

          {image && image.src && (
            <div className="teaserCard__image">
              <img
                src={image.src}
                alt={image.alt || title}
                className="teaserCard__img"
                width={image.width}
                height={image.height}
              />
            </div>
          )}

          <div className="teaserCard__body">

            {category && (
              <span className="teaserCard__category">{category}</span>
            )}

            {title && (
              <h3 className="teaserCard__title">{title}</h3>
            )}

            {excerpt && (
              <p className="teaserCard__excerpt">{excerpt}</p>
            )}

            <div className="teaserCard__footer">
              <span className="teaserCard__meta">
                {date}{date && readTime && ' · '}{readTime}
              </span>
             <a 
                href={linkUrl}
                target={linkTarget}
                rel={linkTarget === '_blank' ? 'noopener noreferrer' : undefined}
                className="teaserCard__link"
              >
                {linkText} →
              </a>
            </div>

          </div>

        </div>
      );
    };

    export default Component;
