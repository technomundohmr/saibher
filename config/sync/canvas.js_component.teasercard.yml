css:
  original: |-
    .teaserCard {
      background: #FFFFFF;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(18, 66, 230, 0.08);
      display: flex;
      flex-direction: column;
      width: 100%;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }

    .teaserCard:hover {
      box-shadow: 0 8px 32px rgba(18, 66, 230, 0.15);
      transform: translateY(-3px);
    }

    .teaserCard__image {
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
    }

    .teaserCard__img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      transition: transform 0.3s ease;
    }

    .teaserCard:hover .teaserCard__img {
      transform: scale(1.04);
    }

    .teaserCard__body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .teaserCard__category {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #4A8A00;
      background: #e8f9d0;
      padding: 3px 10px;
      border-radius: 100px;
      width: fit-content;
    }

    .teaserCard__title {
      font-size: 17px;
      font-weight: 700;
      color: #0A1A5C;
      margin: 0;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .teaserCard__excerpt {
      font-size: 14px;
      color: #2D3A6B;
      margin: 0;
      line-height: 1.65;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .teaserCard__footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 8px;
    }

    .teaserCard__meta {
      font-size: 13px;
      color: #8896BB;
    }

    .teaserCard__link {
      font-size: 13px;
      font-weight: 700;
      color: #1242E6;
      text-decoration: none;
      transition: color 0.2s ease;
      white-space: nowrap;
    }

    .teaserCard__link:hover {
      color: #052699;
    }
