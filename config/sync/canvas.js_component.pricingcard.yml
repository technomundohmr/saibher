js:
  original: |-
    const Component = ({
      title = '',
      description = '',
      price = '',
      previousPrice = '',
      itemList = [],
      featured = false,
      featuredLabel = 'Más solicitado',
      buttonText = '',
      buttonUrl = '#',
      buttonTarget = '_self',
    }) => {

      return (
        <div className={`pricingCard ${featured ? 'pricingCard--featured' : ''}`}>

          {featured && featuredLabel && (
            <span className="pricingCard__badge">{featuredLabel}</span>
          )}

          <div className="pricingCard__header">
            {title && <h3 className="pricingCard__title">{title}</h3>}
            {description && <p className="pricingCard__description">{description}</p>}
          </div>

          <div className="pricingCard__pricing">
            {previousPrice && (
              <span className="pricingCard__previousPrice">{previousPrice}</span>
            )}
            {price && <p className="pricingCard__price">{price}</p>}
          </div>

          {itemList.length > 0 && (
            <ul className="pricingCard__items">
              {itemList.map((item, i) => (
                <li key={i} className="pricingCard__item">
                  <span className="pricingCard__itemIcon">✓</span>
                  {item}
                </li>
              ))}
            </ul>
          )}

          {buttonText && (
            <a
              href={buttonUrl}
              target={buttonTarget}
              rel={buttonTarget === '_blank' ? 'noopener noreferrer' : undefined}
              className="pricingCard__btn"
            >
              {buttonText}
            </a>
          )}

        </div>
      );
    };

    export default Component;
