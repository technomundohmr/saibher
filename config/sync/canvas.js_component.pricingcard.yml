css:
  original: |-
    .pricingCard {
      position: relative;
      background: #FFFFFF;
      border: 2px solid #e8ecf8;
      border-radius: 12px;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    /* Hover — activa diseño destacado */
    .pricingCard:hover,
    .pricingCard--featured {
      border-color: #1242E6;
      box-shadow: 0 8px 32px rgba(18, 66, 230, 0.18);
    }

    /* Badge */
    .pricingCard__badge {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      background: #83E612;
      color: #0A1A5C;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 100px;
      white-space: nowrap;
    }

    /* Header */
    .pricingCard__title {
      font-size: 22px;
      font-weight: 700;
      color: #0A1A5C;
      margin: 0 0 4px;
    }

    .pricingCard__description {
      font-size: 14px;
      color: #2D3A6B;
      margin: 0;
    }

    /* Pricing */
    .pricingCard__pricing {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .pricingCard__previousPrice {
      font-size: 15px;
      color: #8896BB;
      text-decoration: line-through;
    }

    .pricingCard__price {
      font-size: 28px;
      font-weight: 700;
      color: #1242E6;
      margin: 0;
    }

    /* Items */
    .pricingCard__items {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .pricingCard__item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #2D3A6B;
    }

    .pricingCard__itemIcon {
      color: #83E612;
      font-weight: 700;
      flex-shrink: 0;
    }

    /* Button */
    .pricingCard__btn {
      display: block;
      text-align: center;
      padding: 13px 24px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 8px;
      border: 2px solid #1242E6;
      color: #1242E6;
      background: transparent;
      transition: background 0.2s ease, color 0.2s ease;
      margin-top: auto;
    }

    .pricingCard:hover .pricingCard__btn,
    .pricingCard--featured .pricingCard__btn {
      background: #1242E6;
      color: #FFFFFF;
    }
