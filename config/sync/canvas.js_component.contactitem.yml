js:
  original: |-
    const ContactItem = ({ link, target, label, value, icon, color }) => {
      const iconColor = color || '#1242E6';

      const content = (
        <div className="contact-item">
          <div
            className="contact-item__icon"
            style={{ backgroundColor: iconColor }}
          >
            <span className="material-icons" aria-hidden="true">{icon}</span>
          </div>
          <div className="contact-item__text">
            <span className="contact-item__label">{label}</span>
            <span className="contact-item__value">{value}</span>
          </div>
        </div>
      );

      if (link) {
        return (
          <a
            href={link}
            target={target || '_self'}
            rel={target === '_blank' ? 'noopener noreferrer' : undefined}
            className="contact-item__link"
          >
            {content}
          </a>
        );
      }

      return content;
    };

    export default ContactItem;
