      font-size: clamp(28px, 4vw, 42px);
      font-weight: 700;
      margin: 0;
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    .sectionHeader--dark  .sectionHeader__title { color: #0A1A5C; }
    .sectionHeader--blue  .sectionHeader__title { color: #1242E6; }
    .sectionHeader--white .sectionHeader__title { color: #FFFFFF; }

