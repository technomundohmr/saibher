    .sectionHeader {
      width: 100%;
    }

    .sectionHeader--left   { text-align: left; }
    .sectionHeader--center { text-align: center; }
    .sectionHeader--right  { text-align: right; }

    .sectionHeader__eyebrow {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
