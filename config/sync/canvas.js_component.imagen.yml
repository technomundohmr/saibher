js:
  original: |-
    const Component = ({
      image = null,
      aspectRatio,
      link_url = '',
      link_target = '_self',
    }) => {
      const ratioClass = `imageBlock--ratio-${aspectRatio.replace('/', 'x')}`;

      if (!image || !image.src) {
        return <div className="imageBlock--empty"></div>;
      }

      const img = (
        <div className={`imageBlock ${ratioClass}`}>
          <img
            className="imageBlock__img"
            src={image.src}
            alt={image.alt || ''}
            width='100%'
          />
        </div>
      );

      if (link_url) {
        return (
          <a
            href={link_url}
            target={link_target}
            rel={link_target === '_blank' ? 'noopener noreferrer' : undefined}
            className="imageBlock__link"
          >
            {img}
          </a>
        );
      }

      return img;
    };

    export default Component;
