css:
  original: |-
    .richText {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
    }

    /* Eyebrow */
    .richText__eyebrow {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      width: fit-content;
    }

    .richText__eyebrow--green {color: #4A8A00; }
    .richText__eyebrow--blue  {color: #1242E6; }
    .richText__eyebrow--dark  {color: #0A1A5C; }

    /* Título */
    .richText__title {
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 700;
      color: #0A1A5C;
      margin: 0;
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    .richText__titleStart {
      color: #0A1A5C;
    }

    .richText__titleHighlight--blue  { color: #1242E6; }
    .richText__titleHighlight--green { color: #83E612; }
    .richText__titleHighlight--dark  { color: #0A1A5C; }

    /* Body */
    .richText__body {
      font-size: clamp(15px, 1.5vw, 17px);
      color: #2D3A6B;
      margin: 0;
      line-height: 1.75;
    }

    /* Chips */
    .richText__chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .richText__chip {
      font-size: 13px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 100px;
      border: 1px solid transparent;
    }

    .richText__chip--blue  { background: #F4F6FF; color: #1242E6; border-color: #C5CFFA; }
    .richText__chip--green { background: #e8f9d0; color: #4A8A00; border-color: #b8f07a; }
    .richText__chip--dark  { background: #F4F6FF; color: #0A1A5C; border-color: #D0D7F5; }

    /* Link */
    .richText__link {
      font-size: 15px;
      font-weight: 700;
      color: #1242E6;
      text-decoration: none;
      width: fit-content;
      transition: color 0.2s ease;
    }

    .richText__link:hover {
      color: #052699;
    }
