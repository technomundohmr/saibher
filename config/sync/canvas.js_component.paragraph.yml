js:
  original: |-
    const Component = ({
      eyebrow,
      eyebrowColor,
      titleStart,
      titleHighlight,
      titleHighlightColor = 'blue',
      body = 'aaaa',
      chips,
      chipsColor,
      linkText = '',
      linkUrl = '#',
      linkTarget = '_self',
    }) => {
      const chipList = chips ? chips.map(c => c.trim()).filter(Boolean) : [];

      return (
        <div className="richText">
          
          {eyebrow && (
            <span className={`richText__eyebrow richText__eyebrow--${eyebrowColor}`}>
              {eyebrow}
            </span>
          )}

          {(titleStart || titleHighlight) && (
            <h2 className="richText__title">
              {titleStart && <span className="richText__titleStart">{titleStart} </span>}
              {titleHighlight && (
                <span className={`richText__titleHighlight richText__titleHighlight--${titleHighlightColor}`}>
                  {titleHighlight}
                </span>
              )}
            </h2>
          )}

          {body && <p className="richText__body">{parce(body)}</p>}

          {chipList.length > 0 && (
            <div className="richText__chips">
              {chipList.map((chip, i) => (
                <span key={i} className={`richText__chip richText__chip--${chipsColor}`}>
                  {chip}
                </span>
              ))}
            </div>
          )}

          {linkText && (
            <a
              href={linkUrl}
              target={linkTarget}
              rel={linkTarget === '_blank' ? 'noopener noreferrer' : undefined}
              className="richText__link"
            >
              {linkText} →
            </a>
          )}

        </div>
      );
    };

    export default Component;
