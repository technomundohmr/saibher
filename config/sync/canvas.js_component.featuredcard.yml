css:
  original: |-
    .featureCard {
      background: #FFFFFF;
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 2px 8px rgba(18, 66, 230, 0.08);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .featureCard:hover {
      border-color: var(--dark_blue);
      box-shadow: 0 8px 32px rgba(18, 66, 230, 0.18);
    }

    /* Icon Wrapper */
    .featureCard__iconWrapper {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      background: #C5CFFA;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }

    .featureCard:hover .featureCard__iconWrapper {
      background: var(--dark_blue);
    }

    /* Icon */
    .featureCard__icon {
      font-size: 28px;
      color: var(--dark_blue);
      transition: color 0.2s ease;
    }

    .featureCard:hover .featureCard__icon {
      color: #FFFFFF;
    }

    /* Title */
    .featureCard__title {
      font-size: 19px;
      font-weight: 700;
      color: #0A1A5C;
      margin: 0;
      line-height: 1.3;
    }

    /* Description */
    .featureCard__description {
      font-size: 15px;
      color: #2D3A6B;
      margin: 0;
      line-height: 1.65;
      flex: 1;
    }

    /* Link */
    .featureCard__link {
      font-size: 14px;
      font-weight: 700;
      color: var(--dark_blue);
      text-decoration: none;
      margin-top: 4px;
      transition: color 0.2s ease;
    }

    .featureCard__link:hover {
      color: #052699;
    }
