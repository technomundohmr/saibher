css:
  original: |-
    .process-steps {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 32px;
      position: relative;
    }

    .process-steps__item {
      flex: 1 1 200px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .process-steps__icon-wrapper {
      position: relative;
      margin-bottom: 20px;
    }

    .process-steps__icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background-color: #1242E6;
      display: grid;
      place-items: center;
      color: #ffffff;
    }

    .process-steps__icon .material-icons {
      font-size: 26px;
    }

    .process-steps__number {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background-color: #83E612;
      color: #0A1A5C;
      font-size: 0.7rem;
      font-weight: 700;
      display: grid;
      place-items: center;
      border: 2px solid #ffffff;
    }

    .process-steps__title {
      font-family: "Plus Jakarta Sans", sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      color: #0A1A5C;
      margin-bottom: 8px;
    }

    .process-steps__description {
      font-size: 0.9rem;
      color: #2D3A6B;
      line-height: 1.5;
      max-width: 240px;
    }

    @media (min-width: 768px) {
      .process-steps::before {
        content: "";
        position: absolute;
        top: 32px;
        left: 60px;
        right: 60px;
        height: 1px;
        background-color: #E4E9FF;
        z-index: 0;
      }
    }
