js:
  original: |-
    const ProcessSteps = ({
      stepOneIcon, stepOneTitle, stepOneDescription,
      stepTwoIcon, stepTwoTitle, stepTwoDescription,
      stepThreeIcon, stepThreeTitle, stepThreeDescription,
      stepFourIcon, stepFourTitle, stepFourDescription
    }) => {
      const steps = [
        { number: 1, icon: stepOneIcon, title: stepOneTitle, description: stepOneDescription },
        { number: 2, icon: stepTwoIcon, title: stepTwoTitle, description: stepTwoDescription },
        { number: 3, icon: stepThreeIcon, title: stepThreeTitle, description: stepThreeDescription },
        { number: 4, icon: stepFourIcon, title: stepFourTitle, description: stepFourDescription }
      ];

      return (
        <div className="process-steps">
          {steps.map((step) => (
            <div className="process-steps__item" key={step.number}>
              <div className="process-steps__icon-wrapper">
                <div className="process-steps__icon">
                  <span className="material-icons" aria-hidden="true">{step.icon}</span>
                </div>
                <span className="process-steps__number">{step.number}</span>
              </div>
              <h3 className="process-steps__title">{step.title}</h3>
              <p className="process-steps__description">{step.description}</p>
            </div>
          ))}
        </div>
      );
    };

    export default ProcessSteps;
